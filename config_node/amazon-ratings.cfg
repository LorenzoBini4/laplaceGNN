# Heterophilous benchmark (Platonov et al., 2023), 10 official splits; defaults copied from cora.cfg (tuning overrides them).
--dataset=amazon-ratings
--dataset_dir=./data/datasets
--epochs=500


# Architecture
--graph_encoder_layer=512
--graph_encoder_layer=512
--predictor_hidden_size=512

# Views
--view_mode=spectral+feat
--prob_feat=0.4
# used only with --view_mode=random (values from coauthor-cs.cfg)
--drop_edge_p_1=0.3
--drop_feat_p_1=0.3
--drop_edge_p_2=0.2
--drop_feat_p_2=0.4
--lapl_max_lr=100
--lapl_min_lr=0.1
--lapl_budget_ratio=0.3
--lapl_iters=40

# Adversarial bootstrapping
--adv_delta=1e-3
--adv_step_size=1e-3
--adv_m=3
--accumulation_steps=1

# Training
--lr=1e-3
--weight_decay=1e-5
--mm=0.99
--lr_warmup_epochs=50

# Other
--logdir=./runs/amazon-ratings
--eval_epochs=25
