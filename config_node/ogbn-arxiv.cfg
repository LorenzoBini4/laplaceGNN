# Dataset ---> epochs=5000
--dataset=ogbn-arxiv
--dataset_dir=./data
--epochs=2500

# Architecture. Second graph_encoder_layer was 256
--graph_encoder_layer=256
--graph_encoder_layer=256
--graph_encoder_layer=256
--predictor_hidden_size=512

# Views. drop_* are used only with --view_mode=random or spectral+random
# too large for the dense spectral module (Phase 1 adds a sparse backend)
--view_mode=random
--drop_edge_p_1=0.3
--drop_feat_p_1=0.1
--drop_edge_p_2=0.2
--drop_feat_p_2=0.4

# Training
--lr=1e-5
--mm=0.99
--lr_warmup_epochs=500
# AdamW weight decay actually applied by the original script (Args.weight_decay)
# (this file used to say 1e-6; the original script ignored the flag)
--weight_decay=8e-4

# Evaluation: 10 random 10/10/80 splits (ignored where official splits exist)
--num_eval_splits=10

# Other
--logdir=./runs/ogbn-arxiv
--eval_epochs=125
