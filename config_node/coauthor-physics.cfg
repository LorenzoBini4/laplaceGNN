# Dataset
--dataset=coauthor-physics
--dataset_dir=./data
--epochs=10000

# Architecture
--graph_encoder_layer=256
--graph_encoder_layer=128
--predictor_hidden_size=512

# Views. drop_* are used only with --view_mode=random or spectral+random
# too large for the dense spectral module (Phase 1 adds a sparse backend)
--view_mode=random
--drop_edge_p_1=0.4
--drop_feat_p_1=0.1
--drop_edge_p_2=0.1
--drop_feat_p_2=0.4

# Training
--lr=1e-5
--mm=0.99
--lr_warmup_epochs=1000
# AdamW weight decay actually applied by the original script (Args.weight_decay)
# (this file used to say 1e-5; the original script ignored the flag)
--weight_decay=8e-4

# Evaluation: 10 random 10/10/80 splits (ignored where official splits exist)
--num_eval_splits=10

# Other
--logdir=./runs/coauthor-physics
--eval_epochs=250
